<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loading-overlay.css">
    <title>Home - Clark College Events</title>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="container">
        <h1 class="visually-hidden">Clark College Events</h1>
        <div class="sticky-nav-wrapper">
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="popup.html" id="active-page"
                            aria-current="page">Home</a></li>
                    <li><a href="search.html">Search Events</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="changelog.html">Change Log</a></li>
                </ul>
            </nav>

            <div id="info-message" style="display: none;">
                <a href="#top">General Events</a>
                <span class="nav-divider">•</span>
                <a href="#training-events">Employee Training and Development
                </a>
            </div>
        </div>

        <div id="filter-search" style="display: none;">
            <div class="filter-input-wrapper">
                <label for="filter-input" class="visually-hidden">Filter events
                    by keyword</label>
                <input type="text" id="filter-input"
                    placeholder="Filter events...">
                <button id="clear-filter" aria-label="Clear filter"
                    title="Clear">&times;</button>
            </div>
        </div>

        <div id="permission-prompt"
            style="display:none; text-align:center; padding:30px 20px;">
            <i class="fa-solid fa-shield-halved"
                style="font-size:2em; color:#002855; margin-bottom:12px;"
                aria-hidden="true"></i>
            <p style="margin:0 0 15px 0; font-size:14px; color:#333;">This
                extension needs permission to access Clark College event data.
            </p>
            <button id="grant-permission-btn"
                style="background:#002855; color:white; border:none; padding:10px 24px; border-radius:4px; font-size:14px; cursor:pointer; font-family:'Roboto',sans-serif;">Grant
                Permission</button>
        </div>
        <main id="main-content"
            style="opacity:0; transition: opacity 0.4s; position:relative;">
            <div id="messages" role="alert"></div>
            <div id="general-events"></div>
            <div id="training-events"></div>
            <div id="filter-status" class="visually-hidden" role="status"
                aria-live="polite" aria-atomic="true"></div>
        </main>
        <div id="loading-message" role="status" aria-live="polite">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span class="loading-text">Getting data from 25Live...</span>
        </div>
    </div>
    <footer id="footer" style="display:none;">
        <span id="version-number"></span>
    </footer>
    <script src="js/feed.js"></script>
    <script src="js/popup.js"></script>
</body>

</html>
